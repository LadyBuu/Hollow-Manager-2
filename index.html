<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Blades Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header>
        <div class="header-top">
            <h1>Hollow <span>Blades</span></h1>
            <button class="burger-btn" id="nav-toggle" aria-label="Toggle navigation">☰</button>
        </div>
        <nav id="main-nav">
            <a href="#" data-tab="dashboard" class="active">Dashboard</a>
            <a href="#" data-tab="characters">Characters</a>
            <a href="#" data-tab="teams">Teams</a>
            <a href="#" data-tab="tournaments">Tournaments</a>
            <a href="#" data-tab="curriculum">Curriculum</a>
            <a href="#" data-tab="missions">Missions</a>
            <a href="#" data-tab="social">Social</a>
        </nav>
        <div class="header-actions" id="header-actions">
            <button id="export-json-btn" class="small">Export JSON</button>
            <button id="import-json-btn" class="small">Import JSON</button>
            <button id="export-csv-btn" class="small">Export CSV</button>
            <button id="import-csv-btn" class="small">Import CSV</button>
            <button id="template-csv-btn" class="small">Template CSV</button>
            <input type="file" id="json-file-input" accept=".json" style="display:none" />
            <input type="file" id="csv-file-input" accept=".csv" style="display:none" />
        </div>
    </header>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <main>
        <!-- Tab: Dashboard -->
        <div id="tab-dashboard" class="tab-content active">
            <!-- Rendered by dashboard.js -->
        </div>

        <!-- Tab: Characters -->
        <div id="tab-characters" class="tab-content">
            <!-- Rendered by characters/index.js -->
        </div>

        <!-- Tab: Teams -->
        <div id="tab-teams" class="tab-content">
            <!-- Rendered by team-manager.js -->
        </div>

        <!-- Tab: Tournaments -->
        <div id="tab-tournaments" class="tab-content">
            <!-- Rendered by tournaments-ui.js -->
        </div>

        <!-- Tab: Curriculum -->
        <div id="tab-curriculum" class="tab-content">
            <!-- Rendered by curriculum-main.js -->
        </div>

        <!-- Tab: Missions -->
        <div id="tab-missions" class="tab-content">
            <!-- Rendered by missions.js -->
        </div>

        <!-- Tab: Social -->
        <div id="tab-social" class="tab-content">
            <!-- Rendered by social.js -->
        </div>
    </main>

    <!-- ============================================================
         SHARED MODAL CONTAINER
         ============================================================ -->
    <div id="modal-container" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="close-modal" id="modal-close">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- ============================================================
         CHARACTER DETAIL MODAL
         ============================================================ -->
    <div id="character-detail-modal" class="modal hidden">
        <div class="modal-content wide">
            <div class="modal-header">
                <h3 id="detail-character-name">Character</h3>
                <button class="close-modal" id="close-character-detail">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-tabs">
                    <button class="detail-tab-btn active" data-tab="name">Name</button>
                    <button class="detail-tab-btn" data-tab="physical">Physical</button>
                    <button class="detail-tab-btn" data-tab="personality">Personality</button>
                    <button class="detail-tab-btn" data-tab="career">Career</button>
                    <button class="detail-tab-btn" data-tab="academic">Academic</button>
                    <button class="detail-tab-btn" data-tab="stats">Stats</button>
                    <button class="detail-tab-btn" data-tab="social">Social</button>
                    <button class="detail-tab-btn" data-tab="notes">Notes</button>
                </div>
                <div id="detail-tab-content">
                    <div id="detail-name" class="detail-tab-panel active"></div>
                    <div id="detail-physical" class="detail-tab-panel" style="display:none;"></div>
                    <div id="detail-personality" class="detail-tab-panel" style="display:none;"></div>
                    <div id="detail-career" class="detail-tab-panel" style="display:none;"></div>
                    <div id="detail-academic" class="detail-tab-panel" style="display:none;"></div>
                    <div id="detail-stats" class="detail-tab-panel" style="display:none;"></div>
                    <div id="detail-social" class="detail-tab-panel" style="display:none;"></div>
                    <div id="detail-notes" class="detail-tab-panel" style="display:none;"></div>
                </div>
                <div class="form-actions">
                    <button id="edit-character-from-detail" class="primary">Edit Character</button>
                    <button id="close-character-detail-btn" class="secondary">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         SCRIPTS - LOAD ORDER IS CRITICAL
         ============================================================

         1. CONSTANTS - MUST BE FIRST
         2. UTILITIES - Pure helpers
         3. CORE MODULES - Data layer and infrastructure
         4. CORE DOMAIN - Business logic modules
         5. FEATURE MODULES - UI modules
         6. APP BOOTSTRAPPER - Orchestrates everything
         ============================================================ -->

    <!-- ============================================================
         1. CONSTANTS - MUST BE FIRST
         ============================================================ -->
    <script src="js/constants.js"></script>

    <!-- ============================================================
         2. UTILITIES
         ============================================================ -->
    <script src="js/utils/core-utils.js"></script>
    <script src="js/utils/dom-utils.js"></script>
    <script src="js/utils/notification.js"></script>
    <script src="js/utils/calendar-utils.js"></script>

    <!-- ============================================================
         3. CORE MODULES
         ============================================================ -->
    <script src="js/core/state.js"></script>
    <script src="js/core/database.js"></script>
    <script src="js/core/loader.js"></script>
    <script src="js/core/tab-manager.js"></script>

    <!-- ============================================================
         4. CORE DOMAIN MODULES
         ============================================================ -->
    <script src="js/core/class-core.js"></script>
    <script src="js/core/calendar-core.js"></script>
    <script src="js/core/discipline-core.js"></script>
    <script src="js/core/grade-core.js"></script>
    <script src="js/core/group-core.js"></script>
    <script src="js/core/location-core.js"></script>
    <script src="js/core/ranking-core.js"></script>
    <script src="js/core/schedule-core.js"></script>

    <!-- ============================================================
         5. EXPORT MODULE
         ============================================================ -->
    <script src="js/export.js"></script>

    <!-- ============================================================
         6. FEATURE MODULES
         ============================================================ -->

    <!-- Dashboard -->
    <script src="js/modules/dashboard.js"></script>

    <!-- Characters (split modules - load in dependency order) -->
    <script src="js/modules/characters/character-stats.js"></script>
    <script src="js/modules/characters/character-crud.js"></script>
    <script src="js/modules/characters/character-classes.js"></script>
    <script src="js/modules/characters/character-eliminations.js"></script>
    <script src="js/modules/characters/character-views.js"></script>
    <script src="js/modules/characters/character-list.js"></script>
    <script src="js/modules/characters/character-form.js"></script>
    <script src="js/modules/characters/character-detail.js"></script>
    <script src="js/modules/characters/character-events.js"></script>
    <script src="js/modules/characters/index.js"></script>

    <!-- Teams -->
    <script src="js/modules/teams/team-core.js"></script>
    <script src="js/modules/teams/team-filters.js"></script>
    <script src="js/modules/teams/team-render.js"></script>
    <script src="js/modules/teams/team-members.js"></script>
    <script src="js/modules/teams/team-rankings.js"></script>
    <script src="js/modules/teams/team-modals.js"></script>
    <script src="js/modules/teams/team-manager.js"></script>

    <!-- Tournaments -->
    <script src="js/modules/tournaments/tournaments-core.js"></script>
    <script src="js/modules/tournaments/tournaments-ui.js"></script>

    <!-- Curriculum -->
    <script src="js/modules/curriculum/curriculum-main.js"></script>
    <script src="js/modules/curriculum/disciplines.js"></script>
    <script src="js/modules/curriculum/groups.js"></script>
    <script src="js/modules/curriculum/class-view.js"></script>
    <script src="js/modules/curriculum/instructor-calendar.js"></script>
    <script src="js/modules/curriculum/schedule.js"></script>
    <script src="js/modules/curriculum/grades.js"></script>
    <script src="js/modules/curriculum/ranking.js"></script>
    <script src="js/modules/curriculum/classes.js"></script>

    <!-- Missions -->
    <script src="js/modules/missions.js"></script>

    <!-- Social -->
    <script src="js/modules/social.js"></script>

    <!-- ============================================================
         7. APP BOOTSTRAPPER - MUST BE LAST
         ============================================================ -->
    <script src="js/app.js"></script>

</body>
</html>
