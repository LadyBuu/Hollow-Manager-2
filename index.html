<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Manager 2</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <div class="header-top">
                <h1>Hollow Manager 2</h1>
                <button class="burger-btn" id="nav-toggle" aria-label="Toggle navigation">☰</button>
            </div>

            <nav id="main-nav">
                <a href="#dashboard" data-tab="dashboard">Dashboard</a>
                <a href="#characters" data-tab="characters">Characters</a>
                <a href="#teams" data-tab="teams">Teams</a>
                <a href="#calendar" data-tab="calendar">Calendar</a>
                <a href="#social" data-tab="social">Social</a>
                <a href="#academy" data-tab="academy">Academy</a>
                <a href="#missions" data-tab="missions">Missions</a>
            </nav>

            <div class="header-actions">
                <button id="export-json-btn" class="small" title="Export JSON" aria-label="Export JSON">↓</button>
                <button id="import-json-btn" class="small" title="Import JSON" aria-label="Import JSON">↑</button>
                <input type="file" id="json-file-input" accept=".json" style="display:none;">

                <button id="export-characters-csv-btn" class="small" title="Export Characters" aria-label="Export Characters">↓⛹</button>
                <button id="import-characters-csv-btn" class="small" title="Import Characters" aria-label="Import Characters">↑⛹</button>
                <button id="template-characters-csv-btn" class="small secondary" title="Character Template" aria-label="Character Template">⛹▤</button>
                <input type="file" id="characters-csv-file-input" accept=".csv" style="display:none;">

                <button id="export-missions-csv-btn" class="small" title="Export Missions" aria-label="Export Missions">↓⚑</button>
                <button id="import-missions-csv-btn" class="small" title="Import Missions" aria-label="Import Missions">↑⚑</button>
                <button id="template-missions-csv-btn" class="small secondary" title="Mission Template" aria-label="Mission Template">⚑▤</button>
                <input type="file" id="missions-csv-file-input" accept=".csv" style="display:none;">
            </div>
        </header>

        <main id="main-content">
            <div id="tab-dashboard" class="tab-content active"></div>
            <div id="tab-characters" class="tab-content"></div>
            <div id="tab-teams" class="tab-content"></div>
            <div id="tab-calendar" class="tab-content"></div>
            <div id="tab-social" class="tab-content"></div>
            <div id="tab-academy" class="tab-content"></div>
            <div id="tab-missions" class="tab-content"></div>
        </main>
    </div>

    <!-- ============================================================
         UTILITIES - MUST LOAD FIRST
         ============================================================ -->
    <script src="js/utils/object-utils.js"></script>
    <script src="js/utils/id-utils.js"></script>
    <script src="js/utils/validation-utils.js"></script>
    <script src="js/utils/format-utils.js"></script>
    <script src="js/utils/dom-utils.js"></script>
    <script src="js/utils/form-utils.js"></script>
    <script src="js/utils/timing-utils.js"></script>
    <script src="js/utils/modal.js"></script>
    <script src="js/utils/notification.js"></script>

    <!-- ============================================================
         SHARED CONSTANTS
         ============================================================
         Load order within this section matters:

           - tournament-schema.js is loaded here (not in the
             tournament block) because tournament-constants.js reads
             the schema's enum arrays at load time. If the schema
             loads later, tournament-constants falls back to local
             lists and warns on every page load.
         ============================================================ -->
    <script src="js/modules/shared/constants.js"></script>
    <script src="js/modules/shared/calendar-constants.js"></script>
    <script src="js/modules/shared/character-constants.js"></script>
    <script src="js/modules/shared/academy-constants.js"></script>
    <script src="js/modules/shared/magic-constants.js"></script>
    <script src="js/modules/shared/social-constants.js"></script>
    <script src="js/modules/shared/team-constants.js"></script>

    <script src="js/modules/tournaments/tournament-schema.js"></script>
    <script src="js/modules/shared/tournament-constants.js"></script>

    <script src="js/utils/calendar-validation.js"></script>

    <!-- ============================================================
         SHARED QUERIES
         ============================================================ -->
    <script src="js/modules/shared/queries/character-queries.js"></script>
    <script src="js/modules/shared/queries/team-queries.js"></script>
    <script src="js/modules/shared/queries/tournament-queries.js"></script>
    <script src="js/modules/shared/queries/mission-queries.js"></script>
    <script src="js/modules/shared/queries/social-queries.js"></script>
    <script src="js/modules/shared/queries/discipline-queries.js"></script>
    <script src="js/modules/shared/queries/location-queries.js"></script>
    <script src="js/modules/shared/queries/elimination-queries.js"></script>
    <script src="js/modules/shared/queries/calendar-queries.js"></script>

    <!-- ============================================================
         CORE INFRASTRUCTURE
         ============================================================ -->
    <script src="js/core/activity-log.js"></script>
    <script src="js/core/database.js"></script>
    <script src="js/core/loader.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/tab-manager.js"></script>
    <script src="js/core/mutation-pipeline.js"></script>

    <!-- ============================================================
         CALENDAR DOMAIN
         ============================================================ -->
    <script src="js/modules/calendar/schedule-core.js"></script>
    <script src="js/modules/calendar/calendar-renderer.js"></script>
    <script src="js/modules/calendar/calendar-aggregator.js"></script>
    <script src="js/modules/calendar/calendar-ui-base.js"></script>
    <script src="js/modules/calendar/student-calendar-ui.js"></script>
    <script src="js/modules/calendar/instructor-calendar-ui.js"></script>
    <script src="js/modules/calendar/location-calendar-ui.js"></script>
    <script src="js/modules/calendar/index.js"></script>

    <!-- ============================================================
         ACADEMY DOMAIN - BASE ENTITIES AND CROSS-CUTTING SERVICES
         ============================================================
         Load order within this section matters:

           - Grades/disciplines must load after AcademyGradeSchemes
             and AcademyGrades respectively.
           - AcademyPerformance must load before AcademyRanking.
           - AcademyCascade, AcademySettings, AcademyEnrolments,
             AcademySocialScore are cross-cutting.
           - AcademyAutoGroupsRead must load before AcademyGroups
             (the read aliases delegate to it at call time).
           - AcademyWeeklyTeams (week-scoped assignment data) must
             load before AcademyAggregator, which reads it for the
             Weekly Teams view model. AcademyModule's mount-time
             dependency check requires it.
         ============================================================ -->
    <script src="js/modules/academy/academy-grade-schemes.js"></script>
    <script src="js/modules/academy/academy-classes.js"></script>
    <script src="js/modules/academy/academy-grades.js"></script>
    <script src="js/modules/academy/academy-disciplines.js"></script>
    <script src="js/modules/academy/academy-locations.js"></script>

    <script src="js/modules/academy/academy-cascade.js"></script>
    <script src="js/modules/academy/academy-settings.js"></script>
    <script src="js/modules/academy/academy-enrolments.js"></script>
    <script src="js/modules/academy/academy-social-score.js"></script>
    <script src="js/modules/academy/academy-performance.js"></script>

    <!-- AcademyAutoGroupsRead lives in the academy folder (not in
         shared/queries). It must load before academy-groups.js. -->
    <script src="js/modules/academy/academy-auto-groups-read.js"></script>
    <script src="js/modules/academy/academy-groups.js"></script>

    <script src="js/modules/academy/academy-ranking.js"></script>

    <script src="js/modules/shared/queries/academy-queries.js"></script>

    <script src="js/modules/academy/academy-schedule.js"></script>
    <script src="js/modules/academy/academy-distribute.js"></script>

    <!-- Week-scoped assignment data. Required by AcademyModule's
         mount-time dependency check and by AcademyAggregator for
         the Weekly Teams view model. -->
    <script src="js/modules/academy/academy-weekly-teams.js"></script>

    <script src="js/modules/academy/academy-aggregator.js"></script>
    <script src="js/modules/academy/academy-ui.js"></script>

    <!-- ============================================================
         SOCIAL DOMAIN
         ============================================================
         Must load before the character domain: character-events.js
         captures SocialCore, SocialGraph, SocialQueries eagerly at
         IIFE time.
         ============================================================ -->
    <script src="js/modules/social/social-core.js"></script>
    <script src="js/modules/social/social-aggregator.js"></script>
    <script src="js/modules/social/social-views.js"></script>
    <script src="js/modules/social/social-graph.js"></script>
    <script src="js/modules/social/social-events.js"></script>
    <script src="js/modules/social/index.js"></script>

    <!-- ============================================================
         CHARACTER DOMAIN
         ============================================================
         Must load before the Academy view shell: academy-crud-modals
         captures CharacterClasses eagerly at IIFE time.
         ============================================================ -->
    <script src="js/modules/characters/character-generator.js"></script>
    <script src="js/modules/characters/character-stats.js"></script>
    <script src="js/modules/characters/character-crud.js"></script>
    <script src="js/modules/characters/character-classes.js"></script>
    <script src="js/modules/characters/character-eliminations.js"></script>
    <script src="js/modules/characters/character-aggregator.js"></script>
    <script src="js/modules/characters/character-list.js"></script>
    <script src="js/modules/characters/character-form.js"></script>
    <script src="js/modules/characters/character-detail.js"></script>
    <script src="js/modules/characters/character-class-view.js"></script>
    <script src="js/modules/characters/character-elimination-view.js"></script>
    <script src="js/modules/characters/character-stats-view.js"></script>
    <script src="js/modules/characters/character-views.js"></script>
    <script src="js/modules/characters/character-events.js"></script>
    <script src="js/modules/characters/index.js"></script>

    <!-- ============================================================
         TOURNAMENT DOMAIN
         ============================================================
         tournament-schema.js has already loaded in the SHARED
         CONSTANTS block. The remaining tournament files load here.

         The four UI-layer files (tournament-render.js,
         tournament-ui.js, tournament-events.js, tournaments/index.js)
         have been removed. They powered the standalone Tournaments
         tab, which does not exist. The Academy-embedded Exams view
         uses the domain layer below and its own view shell files.

         Must load before the Academy view shell:
         academy-tournament-aggregator captures TournamentAggregator
         eagerly at IIFE time.
         ============================================================ -->
    <script src="js/modules/tournaments/tournament-lifecycle.js"></script>
    <script src="js/modules/tournaments/tournament-rules.js"></script>
    <script src="js/modules/tournaments/tournament-matches.js"></script>
    <script src="js/modules/tournaments/tournament-core.js"></script>
    <script src="js/modules/tournaments/tournament-aggregator.js"></script>
    <script src="js/modules/tournaments/tournament-elimination-workflow.js"></script>
    <script src="js/modules/tournaments/tournament-repair.js"></script>

    <!-- ============================================================
         ACADEMY VIEW SHELL
         ============================================================
         Loads last among the Academy-adjacent blocks because view
         modules capture AcademyAggregator, AcademyTournamentAggregator,
         and CharacterClasses eagerly at IIFE time.

         The character-detail aggregator must load before
         academy-view.js, which requires it at load time.

         academy-weekly-teams-members.js must load before
         academy-view.js. It is accessed lazily at call time by
         academy-view's weekly-teams-manage-members handler, but
         loading it in the shell block keeps the Academy view
         dependencies co-located.
         ============================================================ -->
    <script src="js/modules/academy/academy-character-detail-aggregator.js"></script>
    <script src="js/modules/academy/academy-class-detail.js"></script>
    <script src="js/modules/academy/academy-grades-editor.js"></script>
    <script src="js/modules/academy/academy-character-detail.js"></script>
    <script src="js/modules/academy/academy-discipline-view.js"></script>
    <script src="js/modules/academy/academy-location-view.js"></script>
    <script src="js/modules/academy/academy-ranking-view.js"></script>

    <script src="js/modules/academy/academy-weekly-teams-view.js"></script>
    <script src="js/modules/academy/academy-weekly-teams-members.js"></script>

    <script src="js/modules/academy/academy-tournament-view.js"></script>
    <script src="js/modules/academy/academy-tournament-events.js"></script>
    <script src="js/modules/academy/academy-tournament-aggregator.js"></script>
    <script src="js/modules/academy/academy-crud-modals.js"></script>
    <script src="js/modules/academy/academy-view.js"></script>
    <script src="js/modules/academy/index.js"></script>

    <!-- ============================================================
         TEAM DOMAIN
         ============================================================
         Team constants and team queries live in the shared modules.
         They were already loaded above:
           js/modules/shared/team-constants.js
           js/modules/shared/queries/team-queries.js

         Load order within this section matters:

           - TeamAggregator depends on TeamQueries, TeamConstants,
             CharacterQueries, AcademyQueries.
           - TeamRender depends on DomUtils only.
           - TeamEvents depends on TeamCore, TeamAggregator, TeamUI,
             TeamRender.
           - TeamCore depends on TeamConstants, IdUtils,
             MutationPipeline, ObjectUtils.
           - teams/index.js depends on all of the above.
         ============================================================ -->
    <script src="js/modules/teams/team-aggregator.js"></script>
    <script src="js/modules/teams/team-ui.js"></script>
    <script src="js/modules/teams/team-render.js"></script>
    <script src="js/modules/teams/team-core.js"></script>
    <script src="js/modules/teams/team-events.js"></script>
    <script src="js/modules/teams/index.js"></script>

    <!-- ============================================================
         MISSIONS DOMAIN
         ============================================================ -->
    <script src="js/modules/missions/mission-schema.js"></script>
    <script src="js/modules/missions/mission-id.js"></script>
    <script src="js/modules/missions/mission-views.js"></script>
    <script src="js/modules/missions/mission-core.js"></script>
    <script src="js/modules/missions/mission-aggregator.js"></script>
    <script src="js/modules/missions/mission-render.js"></script>
    <script src="js/modules/missions/mission-ui.js"></script>
    <script src="js/modules/missions/index.js"></script>

    <!-- ============================================================
         IMPORT / EXPORT DOMAIN
         ============================================================ -->
    <script src="js/import-export/export-utils.js"></script>
    <script src="js/import-export/import-result.js"></script>
    <script src="js/import-export/csv-parser.js"></script>
    <script src="js/import-export/export-schema.js"></script>
    <script src="js/import-export/export-envelope.js"></script>
    <script src="js/import-export/format-migrations.js"></script>
    <script src="js/import-export/cross-domain-validator.js"></script>
    <script src="js/import-export/import-pipeline.js"></script>
    <script src="js/import-export/json-io.js"></script>
    <script src="js/import-export/character-csv.js"></script>
    <script src="js/import-export/mission-csv.js"></script>
    <script src="js/import-export/ui.js"></script>
    <script src="js/import-export/index.js"></script>

    <!-- ============================================================
         APPLICATION SETTINGS
         ============================================================ -->
    <script src="js/modules/application/application-settings-core.js"></script>
    <script src="js/modules/application/application-settings-queries.js"></script>

    <!-- ============================================================
         DASHBOARD
         ============================================================ -->
    <script src="js/modules/dashboard/dashboard-aggregator.js"></script>
    <script src="js/modules/dashboard/dashboard-render.js"></script>
    <script src="js/modules/dashboard/dashboard-ui.js"></script>
    <script src="js/modules/dashboard/index.js"></script>

    <!-- ============================================================
         BOOTSTRAP + APP SHELL
         ============================================================ -->
    <script src="js/core/bootstrap.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
