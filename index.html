<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Manager 2</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>Hollow Manager 2</h1>
            <nav id="main-nav">
                <ul>
                    <li><a href="#dashboard" data-tab="dashboard">Dashboard</a></li>
                    <li><a href="#characters" data-tab="characters">Characters</a></li>
                    <li><a href="#classes" data-tab="classes">Classes</a></li>
                    <li><a href="#teams" data-tab="teams">Teams</a></li>
                    <li><a href="#curriculum" data-tab="curriculum">Curriculum</a></li>
                    <li><a href="#calendar" data-tab="calendar">Calendar</a></li>
                    <li><a href="#missions" data-tab="missions">Missions</a></li>
                    <li><a href="#tournaments" data-tab="tournaments">Tournaments</a></li>
                </ul>
            </nav>
        </header>
        <main id="main-content">
            <div id="tab-dashboard" class="tab-content active"></div>
            <div id="tab-characters" class="tab-content"></div>
            <div id="tab-classes" class="tab-content"></div>
            <div id="tab-teams" class="tab-content"></div>
            <div id="tab-curriculum" class="tab-content"></div>
            <div id="tab-calendar" class="tab-content"></div>
            <div id="tab-missions" class="tab-content"></div>
            <div id="tab-tournaments" class="tab-content"></div>
        </main>
    </div>

    <!-- ============================================================
         CORE UTILITIES - MUST LOAD FIRST
         ============================================================ -->
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/validation-utils.js"></script>
    <script src="js/utils/id-utils.js"></script>
    <script src="js/utils/object-utils.js"></script>
    <script src="js/utils/dom-utils.js"></script>
    <script src="js/utils/form-utils.js"></script>
    <script src="js/utils/character-constants.js"></script>
    <script src="js/utils/social-constants.js"></script>
    <script src="js/utils/magic-constants.js"></script>
    <script src="js/utils/calendar-constants.js"></script>
    <script src="js/utils/calendar-validation.js"></script>

    <!-- ============================================================
         DATA & PERSISTENCE
         ============================================================ -->
    <script src="js/data/database.js"></script>
    <script src="js/data/mutation-pipeline.js"></script>
    <script src="js/data/activity-log.js"></script>

    <!-- ============================================================
         CORE DOMAIN - CHARACTERS
         ============================================================ -->
    <script src="js/modules/characters/character-queries.js"></script>
    <script src="js/modules/characters/character-generator.js"></script>
    <script src="js/modules/characters/character-stats.js"></script>
    <script src="js/modules/characters/character-crud.js"></script>
    <script src="js/modules/characters/character-classes.js"></script>
    <script src="js/modules/characters/character-eliminations.js"></script>
    <script src="js/modules/characters/character-detail-queries.js"></script>
    <script src="js/modules/characters/character-detail.js"></script>
    <script src="js/modules/characters/character-views.js"></script>
    <script src="js/modules/characters/character-list.js"></script>
    <script src="js/modules/characters/character-form.js"></script>
    <script src="js/modules/characters/character-class-view.js"></script>
    <script src="js/modules/characters/character-elimination-view.js"></script>
    <script src="js/modules/characters/character-stats-view.js"></script>
    <script src="js/modules/characters/character-events.js"></script>
    <script src="js/modules/characters/index.js"></script>

    <!-- ============================================================
         CORE DOMAIN - TEAMS (depends on Characters + AcademyQueries)
         ============================================================ -->
    <script src="js/modules/teams/team-core.js"></script>
    <script src="js/modules/teams/team-queries.js"></script>
    <script src="js/modules/teams/team-members.js"></script>
    <script src="js/modules/teams/team-rankings.js"></script>
    <script src="js/modules/teams/team-filters.js"></script>
    <script src="js/modules/teams/team-render.js"></script>
    <script src="js/modules/teams/team-manager.js"></script>

    <!-- ============================================================
         CORE DOMAIN - ACADEMY (depends on Characters + Teams)
         ============================================================ -->
    <!-- Academy data structures first -->
    <script src="js/modules/academy/academy-data.js"></script>
    <!-- Academy domain modules (no AcademyQueries dependency) -->
    <script src="js/modules/academy/academy-classes.js"></script>
    <script src="js/modules/academy/academy-grades.js"></script>
    <script src="js/modules/academy/academy-groups.js"></script>
    <script src="js/modules/academy/academy-ranking.js"></script>
    <!-- Academy read facade (depends on above modules) -->
    <script src="js/modules/academy/academy-queries.js"></script>
    <!-- Academy scheduling (depends on Calendar) -->
    <script src="js/modules/academy/academy-schedule.js"></script>
    <script src="js/modules/academy/academy-distribute.js"></script>
    <!-- Academy UI tabs -->
    <script src="js/modules/academy/tabs/class-tab.js"></script>
    <script src="js/modules/academy/tabs/student-tab.js"></script>
    <script src="js/modules/academy/tabs/faculty-tab.js"></script>
    <!-- Academy module entry -->
    <script src="js/modules/academy/index.js"></script>

    <!-- ============================================================
         CORE DOMAIN - CALENDAR (depends on Characters + Academy)
         ============================================================ -->
    <script src="js/modules/calendar/schedule-core.js"></script>
    <script src="js/modules/calendar/calendar-queries.js"></script>
    <script src="js/modules/calendar/calendar-renderer.js"></script>
    <script src="js/modules/calendar/student-calendar-ui.js"></script>
    <script src="js/modules/calendar/instructor-calendar-ui.js"></script>
    <script src="js/modules/calendar/location-calendar-ui.js"></script>
    <script src="js/modules/calendar/index.js"></script>

    <!-- ============================================================
         CORE DOMAIN - TOURNAMENTS (depends on Characters + Teams + Academy)
         ============================================================ -->
    <script src="js/modules/tournaments/tournaments-schema.js"></script>
    <script src="js/modules/tournaments/tournament-lifecycle.js"></script>
    <script src="js/modules/tournaments/tournaments-core.js"></script>
    <script src="js/modules/tournaments/tournaments-queries.js"></script>
    <script src="js/modules/tournaments/tournaments-matches.js"></script>
    <script src="js/modules/tournaments/tournament-elimination-workflow.js"></script>
    <script src="js/modules/tournaments/tournaments-render.js"></script>
    <script src="js/modules/tournaments/tournaments-repair.js"></script>
    <script src="js/modules/tournaments/tournaments-ui.js"></script>
    <script src="js/modules/tournaments/index.js"></script>

    <!-- ============================================================
         CORE DOMAIN - MISSIONS (depends on Characters + Teams)
         ============================================================ -->
    <script src="js/modules/missions/missions-schema.js"></script>
    <script src="js/modules/missions/mission-rules.js"></script>
    <script src="js/modules/missions/mission-views.js"></script>
    <script src="js/modules/missions/mission-id.js"></script>
    <script src="js/modules/missions/missions-core.js"></script>
    <script src="js/modules/missions/missions-queries.js"></script>
    <script src="js/modules/missions/missions-render.js"></script>
    <script src="js/modules/missions/missions-ui.js"></script>
    <script src="js/modules/missions/index.js"></script>

    <!-- ============================================================
         CROSS-DOMAIN - DASHBOARD (depends on ALL upstream domains)
         MUST BE LAST
         ============================================================ -->
    <script src="js/modules/dashboard/dashboard-queries.js"></script>
    <script src="js/modules/dashboard/dashboard-render.js"></script>
    <script src="js/modules/dashboard/dashboard-ui.js"></script>
    <script src="js/modules/dashboard/index.js"></script>

    <!-- ============================================================
         UI HELPERS - Modals, Notifications, TabManager
         ============================================================ -->
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/notification.js"></script>
    <script src="js/ui/tab-manager.js"></script>

    <!-- ============================================================
         APPLICATION INITIALIZATION
         ============================================================ -->
    <script src="js/app.js"></script>
</body>
</html>
