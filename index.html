<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Manager 2</title>
    <link rel="icon" href="data:," />

    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/characters.css" />
    <link rel="stylesheet" href="css/teams.css" />
    <link rel="stylesheet" href="css/social.css" />
    <link rel="stylesheet" href="css/missions.css" />
    <link rel="stylesheet" href="css/departments.css" />

    <link rel="stylesheet" href="css/academy.css" />

    <link rel="stylesheet" href="css/calendar.css" />

    <script>
        (function() {
            try {
                var stored = localStorage.getItem('hollow-manager-theme');
                if (stored && stored !== 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-top">
                <h1>Hollow Manager 2</h1>
                <button class="burger-btn" id="nav-toggle" aria-label="Toggle navigation">☰</button>
            </div>

            <nav id="main-nav">
                <a href="#dashboard" data-tab="dashboard">Dashboard</a>
                <a href="#characters" data-tab="characters">Characters</a>
                <a href="#teams" data-tab="teams">Teams</a>
                <a href="#departments" data-tab="departments">Departments</a>
                <a href="#social" data-tab="social">Social</a>
                <a href="#academy" data-tab="academy">Academy</a>
                <a href="#missions" data-tab="missions">Missions</a>
            </nav>

            <div class="header-actions">
                <button id="theme-toggle-btn" class="small" title="Toggle theme" aria-label="Toggle theme">☀</button>
                <button id="export-json-btn" class="small" title="Export JSON" aria-label="Export JSON">↓</button>
                <button id="import-json-btn" class="small" title="Import JSON" aria-label="Import JSON">↑</button>
                <input type="file" id="json-file-input" accept=".json" style="display:none;">

                <button id="export-graduates-json-btn" class="small" title="Export Graduates (JSON)" aria-label="Export Graduates JSON">↓🎓</button>
            </div>
        </header>

        <main id="main-content">
            <div id="tab-dashboard" class="tab-content active"></div>
            <div id="tab-characters" class="tab-content"></div>
            <div id="tab-teams" class="tab-content"></div>
            <div id="tab-departments" class="tab-content"></div>
            <div id="tab-social" class="tab-content"></div>
            <div id="tab-academy" class="tab-content"></div>
            <div id="tab-missions" class="tab-content"></div>
        </main>
    </div>

    <!-- ============================================================
         Utilities
         ============================================================ -->
    <script src="js/utils/object-utils.js"></script>
    <script src="js/utils/id-utils.js"></script>
    <script src="js/utils/validation-utils.js"></script>
    <script src="js/utils/format-utils.js"></script>
    <script src="js/utils/dom-utils.js"></script>
    <script src="js/utils/form-utils.js"></script>
    <script src="js/utils/timing-utils.js"></script>

    <script src="js/utils/notification.js"></script>

    <script src="js/utils/theme-manager.js"></script>

    <!-- ============================================================
         Shared constants
         ============================================================ -->

    <script src="js/modules/shared/calendar-constants.js"></script>
    <script src="js/modules/shared/character-constants.js"></script>
    <script src="js/modules/shared/academy-constants.js"></script>

         ============================================================ -->

    <script src="js/modules/shared/queries/tournament-queries.js"></script>

         ============================================================ -->
    <script src="js/core/activity-log.js"></script>
    <script src="js/core/mutation-pipeline.js"></script>

    <!-- ============================================================
         IMPORT / EXPORT (FOUNDATION)
         ============================================================
         Only modules that depend exclusively on the utilities
         and shared queries above. Domain-dependent import/export
         modules (schedule-export, class-roster-export,
         graduates-export-picker) are loaded much later, after
         the Academy domain block.
         ============================================================ -->

    <!-- Core -->
    <script src="js/import-export/export-utils.js"></script>
    <script src="js/import-export/import-result.js"></script>
    <script src="js/import-export/csv-parser.js"></script>
    <script src="js/import-export/export-schema.js"></script>
    <script src="js/import-export/export-envelope.js"></script>
    <script src="js/import-export/format-migrations.js"></script>
    <script src="js/import-export/cross-domain-validator.js"></script>
    <script src="js/import-export/import-pipeline.js"></script>
    <script src="js/import-export/json-io.js"></script>

    <!-- Consolidated character export bundle.
         Installs: CharacterCSV, CharacterRosterExport, CharacterExport,
                   and the four legacy template aliases. -->
    <script src="js/import-export/character-export.js"></script>

    <!-- Mission CSV (schema, export, import, template). -->
    <script src="js/import-export/mission-csv.js"></script>

    <!-- Consolidated team export bundle.
         Installs: TeamExport, TeamExportPicker. -->
    <script src="js/import-export/team-export.js"></script>

    <!-- Character export picker. Reads only the character CSV /
         roster / report globals, all installed above. -->
    <script src="js/import-export/character-export-picker.js"></script>

    <!-- ============================================================
         Core infrastructure (remaining)
         ============================================================ -->
    <script src="js/core/database.js"></script>
    <script src="js/core/loader.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/tab-manager.js"></script>

    <script src="js/modules/shared/member-manager.js"></script>

    <script src="js/modules/calendar/calendar-renderer.js"></script>

    <!-- ============================================================
         Academy domain
         ============================================================ -->
    <script src="js/modules/academy/academy-grade-schemes.js"></script>
    <script src="js/modules/academy/academy-classes.js"></script>
    <script src="js/modules/academy/academy-grades.js"></script>
    <script src="js/modules/academy/academy-disciplines.js"></script>

    <script src="js/modules/academy/academy-cascade.js"></script>
    <script src="js/modules/academy/academy-eliminations.js"></script>

    <script src="js/modules/academy/academy-enrolments.js"></script>
    <script src="js/modules/academy/academy-social-score.js"></script>
    <script src="js/modules/academy/academy-performance.js"></script>

    <script src="js/modules/academy/academy-ranking.js"></script>

    <script src="js/modules/academy/academy-class-disciplines-queries.js"></script>
    <script src="js/modules/academy/academy-class-disciplines.js"></script>
    <script src="js/modules/academy/academy-discipline-sessions-panel.js"></script>
    <script src="js/modules/academy/academy-teaching-groups.js"></script>
    <script src="js/modules/academy/academy-teaching-sessions.js"></script>

    <script src="js/modules/academy/member-adapter-academy.js"></script>
    <script src="js/modules/academy/academy-balance-suggestions.js"></script>

    <!-- ============================================================
         Social domain
         ============================================================ -->
    <script src="js/modules/social/social-core.js"></script>
    <script src="js/modules/social/social-aggregator.js"></script>

    <script src="js/modules/social/social-events.js"></script>
    <script src="js/modules/social/index.js"></script>

    <!-- ============================================================
         Character domain
         ============================================================ -->
    <script src="js/modules/characters/character-generator.js"></script>
    <script src="js/modules/characters/character-stats.js"></script>
    <script src="js/modules/characters/character-moves.js"></script>
    <script src="js/modules/characters/character-crud.js"></script>

    <script src="js/modules/characters/character-strip.js"></script>
    <script src="js/modules/characters/filler-manager-modal.js"></script>

    <script src="js/modules/characters/character-aggregator.js"></script>
    <script src="js/modules/characters/character-list.js"></script>
    <script src="js/modules/characters/character-form.js"></script>
    <script src="js/modules/characters/character-detail.js"></script>
    <script src="js/modules/characters/character-class-view.js"></script>
    <script src="js/modules/characters/character-stats-view.js"></script>
    <script src="js/modules/characters/character-views.js"></script>

    <!-- Bulk create modal. Reads CharacterCRUD.save, uses Modal,
         DomUtils, NotificationSystem. Refreshes CharacterList on
         completion via a lazy lookup. -->
    <script src="js/modules/characters/character-bulk-create.js"></script>

    <!-- JSON import/export for a single character's full profile.
         Loads after CharacterCRUD (uses normaliseCharacterData) and
         before character-events.js (which binds the import/export
         button click handlers). -->
    <script src="js/import-export/character-json-io.js"></script>

    <!-- Career wizard: absorbs no state of its own beyond the
         modal. Reads CharacterQueries and CharacterCRUD lazily.
         Must load after character-crud.js (for
         applyCareerStatusTimeline) and before character-events.js
         (which binds the #career-wizard-btn click handler). -->
    <script src="js/modules/characters/career-status-wizard.js"></script>

    <script src="js/modules/characters/character-events.js"></script>
    <script src="js/modules/characters/index.js"></script>

    <!-- ============================================================
         Research domain
         ============================================================
         Modal-based profile search. Opened from the Research
         button in the characters tab header. Loads after the
         character domain (uses CharacterQueries, and calls
         CharacterDetail.open on result click). No TabManager
         registration; the module is a modal, not a tab.

         Ordering within this block:
           1. research-queries.js   needs CharacterQueries
           2. research-view.js      needs DomUtils
           3. research-events.js    needs Modal, ResearchQueries,
                                    ResearchView; reads
                                    CharacterDetail lazily
           4. index.js              asserts the above three
         ============================================================ -->
    <script src="js/modules/research/research-queries.js"></script>
    <script src="js/modules/research/research-view.js"></script>
    <script src="js/modules/research/research-events.js"></script>
    <script src="js/modules/research/index.js"></script>

    <!-- ============================================================
         Tournament domain
         ============================================================ -->
    <script src="js/modules/tournaments/tournament-elimination-cascade.js"></script>
    <script src="js/modules/tournaments/tournament-cascade.js"></script>
    <script src="js/modules/tournaments/tournament-matches.js"></script>
    <script src="js/modules/tournaments/tournament-core.js"></script>

    <!-- ============================================================
         Academy view shell
         ============================================================ -->
    <script src="js/modules/academy/academy-character-detail-aggregator.js"></script>
    <script src="js/modules/academy/academy-class-detail.js"></script>
    <script src="js/modules/academy/academy-grades-editor.js"></script>
    <script src="js/modules/academy/academy-character-detail.js"></script>
    <script src="js/modules/academy/academy-discipline-view.js"></script>
    <script src="js/modules/academy/academy-discipline-schedule-summary.js"></script>
    <script src="js/modules/academy/academy-location-view.js"></script>
    <script src="js/modules/academy/academy-ranking-view.js"></script>

    <script src="js/modules/academy/academy-weekly-teams-view.js"></script>

    <script src="js/modules/academy/academy-tournament-view.js"></script>
    <script src="js/modules/academy/academy-tournament-events.js"></script>
    <script src="js/modules/academy/academy-tournament-aggregator.js"></script>
    <script src="js/modules/academy/academy-crud-modals.js"></script>

    <script src="js/modules/academy/academy-class-disciplines-picker.js"></script>
    <script src="js/modules/academy/academy-enrollment-modal.js"></script>
    <script src="js/modules/academy/academy-schedule-assign-modal.js"></script>
    <script src="js/modules/academy/academy-schedule-instructor-modal.js"></script>
    <script src="js/modules/academy/academy-session-form-modal.js"></script>
    <script src="js/modules/academy/academy-session-actions-modal.js"></script>
    <script src="js/modules/academy/academy-group-management-modal.js"></script>
    <script src="js/modules/academy/academy-rebalance-modal.js"></script>

    <script src="js/modules/academy/academy-view.js"></script>

    <!-- ============================================================
         Team domain
         ============================================================ -->
    <script src="js/modules/teams/team-aggregator.js"></script>
    <script src="js/modules/teams/team-ui.js"></script>
    <script src="js/modules/teams/team-render.js"></script>
    <script src="js/modules/teams/team-core.js"></script>

    <script src="js/modules/teams/team-matchmaking.js"></script>
    <script src="js/modules/teams/team-matchmaking-view.js"></script>

    <script src="js/modules/teams/timeline-queries.js"></script>
    <script src="js/modules/teams/timeline-view.js"></script>

    <script src="js/modules/teams/member-adapter-teams.js"></script>

    <!-- Team verifier. Loads before team-events so its public API
         is available when the Verify button's click handler
         resolves it lazily.

         Ordering within this block:
           1. team-verifier.js        needs TeamQueries,
                                      TeamConstants,
                                      CharacterQueries
           2. team-verifier-view.js   needs TeamVerifier, Modal,
                                      DomUtils,
                                      NotificationSystem; reads
                                      TeamEvents lazily -->
    <script src="js/modules/teams/team-verifier.js"></script>
    <script src="js/modules/teams/team-verifier-view.js"></script>

    <script src="js/modules/teams/team-events.js"></script>
    <script src="js/modules/teams/index.js"></script>

    <!-- ============================================================
         Departments domain
         ============================================================
         Full module stack. Loads after Team domain (DepartmentCore
         and DepartmentEvents consume TeamQueries for cross-team
         context) and before the Academy controllers block, which
         no longer depends on Departments.

         Intra-domain load order:
           constants  -> schema
           schema     -> queries, core
           queries    -> aggregator
           aggregator -> render, events
           render + events -> index
         ============================================================ -->
    <script src="js/modules/departments/department-constants.js"></script>
    <script src="js/modules/departments/department-schema.js"></script>
    <script src="js/modules/departments/department-queries.js"></script>
    <script src="js/modules/departments/department-core.js"></script>
    <script src="js/modules/departments/department-aggregator.js"></script>
    <script src="js/modules/departments/department-render.js"></script>
    <script src="js/modules/departments/department-events.js"></script>
    <script src="js/modules/departments/index.js"></script>

    <!-- ============================================================
         Academy instructor repair + controllers
         ============================================================ -->
    <script src="js/modules/academy/academy-instructor-repair-view.js"></script>

    <script src="js/modules/academy/controllers/controller-contract.js"></script>
    <script src="js/modules/academy/controllers/academy-controllers.js"></script>

    <script src="js/modules/academy/controllers/academy-people-controller.js"></script>
    <script src="js/modules/academy/controllers/academy-exam-controller.js"></script>
    <script src="js/modules/academy/controllers/academy-weekly-teams-controller.js"></script>
    <script src="js/modules/academy/controllers/academy-ranking-controller.js"></script>
    <script src="js/modules/academy/controllers/academy-discipline-controller.js"></script>
    <script src="js/modules/academy/controllers/academy-location-controller.js"></script>
    <script src="js/modules/academy/controllers/academy-repair-controller.js"></script>

    <script src="js/modules/academy/academy-weekly-teams-operations.js"></script>

    <script src="js/modules/academy/index.js"></script>

    <!-- ============================================================
         Missions domain
         ============================================================ -->
    <script src="js/modules/missions/mission-schema.js"></script>
    <script src="js/modules/missions/mission-rules.js"></script>
    <script src="js/modules/missions/mission-cascade.js"></script>
    <script src="js/modules/missions/mission-core.js"></script>
    <script src="js/modules/missions/mission-views.js"></script>
    <script src="js/modules/missions/mission-render.js"></script>
    <script src="js/modules/missions/mission-aggregator.js"></script>
    <script src="js/modules/missions/mission-ui.js"></script>
    <script src="js/modules/missions/index.js"></script>

    <!-- ============================================================
         IMPORT / EXPORT (DOMAIN-DEPENDENT)
         ============================================================
         These modules read from the Academy domain at load time,
         so they must load after the Academy block above. They are
         grouped here, immediately before ui.js, because they are
         the last import/export consumers to become resolvable.

         Ordering within this block matters:
           1. class-roster-export.js
              Installs the GraduatesExport compatibility alias. Its
              own dependencies (CharacterQueries, AcademyClasses,
              AcademyAggregator, CSV, ExportUtils) are all loaded by
              this point.
           2. schedule-export.js
              Reads AcademyClasses, AcademyTeachingSessions,
              AcademyTeachingGroups, AcademyInstructorCommitments,
              AcademyDisciplines, CharacterQueries, CalendarConstants,
              CalendarValidation, ExportUtils. All loaded.
           3. graduates-export-picker.js
              Needs ClassRosterExport (installed by step 1) and
              AcademyClasses.getClasses (loaded above).
         ============================================================ -->

    <script src="js/import-export/class-roster-export.js"></script>
    <script src="js/import-export/schedule-export.js"></script>
    <script src="js/import-export/graduates-export-picker.js"></script>

    <!-- ============================================================
         Import/export UI — binds header buttons.
         ============================================================ -->
    <script src="js/import-export/ui.js"></script>
    <script src="js/import-export/index.js"></script>

    <!-- ============================================================
         Application settings + dashboard + bootstrap
         ============================================================ -->
    <script src="js/modules/application/application-settings-core.js"></script>
    <script src="js/modules/application/application-settings-queries.js"></script>

    <script src="js/modules/dashboard/dashboard-aggregator.js"></script>
    <script src="js/modules/dashboard/dashboard-render.js"></script>
    <script src="js/modules/dashboard/dashboard-ui.js"></script>
    <script src="js/modules/dashboard/index.js"></script>

    <script src="js/core/bootstrap.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
