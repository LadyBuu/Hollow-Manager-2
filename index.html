    <!-- ============================================================
         ACADEMY MODALS
         ============================================================
         Three Academy-scoped modals. Each is opened by a
         controller and owns its own shell. They load after the
         modules they read through and before the controllers that
         open them.

           academy-class-disciplines-picker.js
             Marks which disciplines a class offers. Opened from
             the class detail panel via
             data-action="edit-class-disciplines". Reads through
             AcademyAggregator.getClassDisciplinesPickerViewModel;
             writes through AcademyClassDisciplines.

           academy-enrollment-modal.js
             Enrols a character in one or more of a class's active
             offerings. Opened from the character Disciplines tab
             via data-action="enroll-discipline". The same modal
             serves instructor assignment to a discipline; the
             caller passes a `title` override. Writes through
             AcademyEnrolments.enrol.

           academy-schedule-assign-modal.js
             Assigns a student to a single slot in the schedule
             grid. Opened from the schedule tab via
             data-action="schedule-assign". Writes through
             AcademySchedule.assignStudentToSlot, which resolves
             or creates the implied teaching group and session.
         ============================================================ -->
    <script src="js/modules/academy/academy-class-disciplines-picker.js"></script>
    <script src="js/modules/academy/academy-enrollment-modal.js"></script>
    <script src="js/modules/academy/academy-schedule-assign-modal.js"></script>
