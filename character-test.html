    <script>
        (function() {
            'use strict';

            var results = [];
            var passed = 0;
            var failed = 0;
            var skipped = 0;

            function log(message, type) {
                type = type || 'info';
                var el = document.createElement('div');
                var color = type === 'pass' ? '#4CAF50' :
                            type === 'fail' ? '#f44336' :
                            type === 'error' ? '#ff5722' :
                            type === 'skip' ? '#ff9800' : '#2196F3';
                el.style.cssText = 'padding:4px 8px;margin:2px 0;border-left:3px solid ' + color + ';background:#1a1a2e;font-size:12px;';
                el.textContent = '[' + type.toUpperCase() + '] ' + message;
                document.getElementById('test-output').appendChild(el);
            }

            function test(description, fn) {
                try {
                    var result = fn();
                    if (result === true || result === undefined) {
                        passed++;
                        results.push({ description: description, passed: true });
                        log('PASS: ' + description, 'pass');
                    } else {
                        failed++;
                        results.push({ description: description, passed: false, error: result });
                        log('FAIL: ' + description + ' - ' + JSON.stringify(result), 'fail');
                    }
                } catch (e) {
                    failed++;
                    results.push({ description: description, passed: false, error: e.message });
                    log('ERROR: ' + description + ' - ' + e.message, 'error');
                    console.error(e);
                }
            }

            function testSkip(description, reason) {
                skipped++;
                results.push({ description: description, passed: true, skipped: true, reason: reason });
                log('SKIP: ' + description + ' (' + reason + ')', 'skip');
            }

            function testModuleLoaded(moduleName, module) {
                if (module === undefined || module === null) {
                    testSkip(moduleName + ' is loaded', 'module not available');
                    return;
                }
                test(moduleName + ' is loaded', function() {
                    return module !== undefined && module !== null;
                });
            }

            function testFunctionExists(module, fnName) {
                if (!module) {
                    testSkip(fnName + ' exists', 'module not available');
                    return;
                }
                test(fnName + ' exists', function() {
                    return typeof module[fnName] === 'function';
                });
            }

            // ============================================================
            // RUN TESTS
            // ============================================================

            function runAllTests() {
                document.getElementById('test-output').innerHTML = '';
                results = [];
                passed = 0;
                failed = 0;
                skipped = 0;

                log('========== TEST SUITE START ==========', 'info');
                log('Testing all modules: Characters, Calendar, Social, Teams, Academy', 'info');

                // ---- CHARACTER MODULE ----
                log('', 'info');
                log('--- CHARACTER MODULE ---', 'info');

                testModuleLoaded('CharacterConstants', window.CharacterConstants);
                if (window.CharacterConstants) {
                    test('CharacterConstants.STAT_KEYS exists', function() {
                        return Array.isArray(window.CharacterConstants.STAT_KEYS);
                    });
                    test('CharacterConstants.STAT_KEYS length is 6', function() {
                        return window.CharacterConstants.STAT_KEYS.length === 6;
                    });

                testModuleLoaded('CharacterQueries', window.CharacterQueries);
                testFunctionExists(window.CharacterQueries, 'getCharacterById');
                testFunctionExists(window.CharacterQueries, 'getDisplayName');
                testFunctionExists(window.CharacterQueries, 'getStudents');
                testFunctionExists(window.CharacterQueries, 'getInstructors');

                testModuleLoaded('CharacterStats', window.CharacterStats);
                testFunctionExists(window.CharacterStats, 'getCharacterStats');
                testFunctionExists(window.CharacterStats, 'getCharacterMagic');

                testModuleLoaded('CharacterCRUD', window.CharacterCRUD);
                testFunctionExists(window.CharacterCRUD, 'save');
                testFunctionExists(window.CharacterCRUD, 'delete');

                testModuleLoaded('CharacterAggregator', window.CharacterAggregator);
                testFunctionExists(window.CharacterAggregator, 'getCharacterDetail');
                testFunctionExists(window.CharacterAggregator, 'getCharacterListViewModel');

                testModuleLoaded('CharacterList', window.CharacterList);
                testFunctionExists(window.CharacterList, 'render');

                testModuleLoaded('CharacterForm', window.CharacterForm);
                testFunctionExists(window.CharacterForm, 'render');
                testFunctionExists(window.CharacterForm, 'collect');

                testModuleLoaded('CharacterEvents', window.CharacterEvents);
                testFunctionExists(window.CharacterEvents, 'init');

                testModuleLoaded('CharacterGenerator', window.CharacterGenerator);
                testFunctionExists(window.CharacterGenerator, 'generatePhysical');
                testFunctionExists(window.CharacterGenerator, 'generateCharacter');

                testModuleLoaded('CharactersModule', window.CharactersModule);
                test('window.mountCharacters exists', function() {
                    return typeof window.mountCharacters === 'function';
                });
                test('window.getCurrentEditId exists', function() {
                    return typeof window.getCurrentEditId === 'function';
                });

                // ---- CALENDAR MODULE ----
                log('', 'info');
                log('--- CALENDAR MODULE ---', 'info');

                document.getElementById('summary-content').innerHTML =
                    '<div style="font-size:24px;">' +
                    '<span class="test-pass">Passed: ' + passed + '</span> | ' +
                    '<span class="test-fail">Failed: ' + failed + '</span> | ' +
                    '<span class="test-skip">Skipped: ' + skipped + '</span> | ' +
                    '<span class="test-info">Total: ' + total + '</span>' +
                    '</div>' +
                    (failed === 0 ?
                        '<p style="color:#4CAF50;font-size:18px;">All tests passed! All modules are ready.</p>' :
                        '<p style="color:#f44336;font-size:18px;">Some tests failed. Check the output above.</p>'
                    ) +
                    (skipped > 0 ?
                        '<p style="color:#ff9800;font-size:14px;">' + skipped + ' tests were skipped due to missing modules.</p>' :
                        ''
                    ) +
                    '<div style="margin-top:12px;font-size:12px;color:var(--text-dim);">' +
                    '<div class="module-group"><span class="module-group-title">Characters:</span> ' +
                    (window.CharacterConstants && window.CharacterQueries && window.CharacterAggregator ? '✅' : '❌') +
                    '</div>' +
                    '<div class="module-group"><span class="module-group-title">Calendar:</span> ' +
                    (window.CalendarConstants && window.ScheduleCore && window.CalendarQueries ? '✅' : '❌') +
                    '</div>' +
                    '<div class="module-group"><span class="module-group-title">Social:</span> ' +
                    (window.SocialConstants && window.SocialQueries && window.SocialCore ? '✅' : '❌') +
                    '</div>' +
                    '<div class="module-group"><span class="module-group-title">Teams:</span> ' +
                    (window.TeamConstants && window.TeamQueries && window.TeamCore ? '✅' : '❌') +
                    '</div>' +
                    '<div class="module-group"><span class="module-group-title">Academy:</span> ' +
                    (window.AcademyConstants && window.AcademyQueries && window.AcademyClasses ? '✅' : '❌') +
                    '</div>' +
                    '</div>';

                document.getElementById('test-controls').classList.remove('hidden');
                document.getElementById('mock-status').textContent = '✅ All dependencies loaded. Tests complete.';
                document.getElementById('mock-status').style.color = '#4CAF50';
            }

            // ============================================================
            // AUTO-RUN ON LOAD
            // ============================================================

            function init() {
                setTimeout(function() {
                    runAllTests();
                }, 800);
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }

            document.addEventListener('DOMContentLoaded', function() {
                var btn = document.getElementById('run-tests-btn');
                if (btn) {
                    btn.addEventListener('click', runAllTests);
                }
            });

        })();
    </script>
</body>
</html>
