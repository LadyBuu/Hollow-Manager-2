    <script>
        (function() {
            'use strict';

            var results = [];
            var passed = 0;
            var failed = 0;
            var skipped = 0;
            var dependencyStatus = {};
            var testOutput = document.getElementById('test-output');

            function log(message, type) {
                type = type || 'info';
                var el = document.createElement('div');
                var color = type === 'pass' ? '#4CAF50' :
                            type === 'fail' ? '#f44336' :
                            type === 'error' ? '#ff5722' :
                            type === 'skip' ? '#ff9800' : '#2196F3';
                el.style.cssText = 'padding:2px 4px;margin:1px 0;border-left:3px solid ' + color + ';background:#1a1a2e;font-size:11px;';
                el.textContent = '[' + type.toUpperCase() + '] ' + message;
                if (testOutput) {
                    testOutput.appendChild(el);
                    testOutput.scrollTop = testOutput.scrollHeight;
                }
            }

            function test(description, fn) {
                try {
                    var result = fn();
                    if (result === true || result === undefined) {
                        passed++;
                        results.push({ description: description, passed: true });
                        log('PASS: ' + description, 'pass');
                    } else {
                        failed++;
                        results.push({ description: description, passed: false, error: result });
                        log('FAIL: ' + description + ' - ' + JSON.stringify(result), 'fail');
                    }
                } catch (e) {
                    failed++;
                    results.push({ description: description, passed: false, error: e.message });
                    log('ERROR: ' + description + ' - ' + e.message, 'error');
                    console.error(e);
                }
            }

            function testSkip(description, reason) {
                skipped++;
                results.push({ description: description, passed: true, skipped: true, reason: reason });
                log('SKIP: ' + description + ' (' + reason + ')', 'skip');
            }

            function testModuleLoaded(moduleName, module) {
                if (module === undefined || module === null) {
                    testSkip(moduleName + ' is loaded', 'module not available');
                    return false;
                }
                test(moduleName + ' is loaded', function() {
                    return module !== undefined && module !== null;
                });
                return true;
            }

            function testFunctionExists(module, fnName) {
                if (!module) {
                    testSkip(fnName + ' exists', 'module not available');
                    return false;
                }
                test(fnName + ' exists', function() {
                    return typeof module[fnName] === 'function';
                });
                return true;
            }

            function checkDependency(depName, depValue) {
                var status = depValue !== undefined && depValue !== null;
                dependencyStatus[depName] = status;
                return status;
            }

            function renderDependencyCheck() {
                var container = document.getElementById('dependency-check-list');
                if (!container) return;

                var html = '<div style="margin-top:8px;font-size:11px;">';
                html += '<strong>Dependency Check:</strong><br>';

                var deps = [
                    { name: 'ObjectUtils', value: window.ObjectUtils },
                    { name: 'IdUtils', value: window.IdUtils },
                    { name: 'ValidationUtils', value: window.ValidationUtils },
                    { name: 'ValidationUtils.isNonEmptyString', value: window.ValidationUtils ? window.ValidationUtils.isNonEmptyString : null },
                    { name: 'CalendarConstants', value: window.CalendarConstants },
                    { name: 'CharacterConstants', value: window.CharacterConstants },
                    { name: 'AcademyConstants', value: window.AcademyConstants },
                    { name: 'MagicConstants', value: window.MagicConstants },
                    { name: 'SocialConstants', value: window.SocialConstants },
                    { name: 'TeamConstants', value: window.TeamConstants },
                    { name: 'CalendarQueries', value: window.CalendarQueries },
                    { name: 'MutationPipeline', value: window.MutationPipeline },
                    { name: 'AcademyClasses', value: window.AcademyClasses }
                ];

                for (var i = 0; i < deps.length; i++) {
                    var d = deps[i];
                    var exists = d.value !== undefined && d.value !== null;
                    var cls = exists ? 'dep-ok' : 'dep-missing';
                    var icon = exists ? '✅' : '❌';
                    html += '<div class="dependency-check"><span class="' + cls + '">' + icon + ' ' + d.name + '</span></div>';
                }

                html += '</div>';
                container.innerHTML = html;
            }

            // ============================================================
            // RUN TESTS
            // ============================================================

            function runAllTests() {
                if (testOutput) {
                    testOutput.innerHTML = '';
                }
                results = [];
                passed = 0;
                failed = 0;
                skipped = 0;

                renderDependencyCheck();

                log('========== TEST SUITE START ==========', 'info');
                log('Testing all modules: Characters, Calendar, Social, Teams, Academy', 'info');

                // ---- CORE UTILITIES ----
                log('', 'info');
                log('--- CORE UTILITIES ---', 'info');

                testModuleLoaded('ObjectUtils', window.ObjectUtils);
                if (window.ObjectUtils) {
                    testFunctionExists(window.ObjectUtils, 'deepClone');
                }

                testModuleLoaded('IdUtils', window.IdUtils);
                if (window.IdUtils) {
                    testFunctionExists(window.IdUtils, 'generateId');
                    testFunctionExists(window.IdUtils, 'normaliseId');
                }

                testModuleLoaded('ValidationUtils', window.ValidationUtils);
                if (window.ValidationUtils) {
                    testFunctionExists(window.ValidationUtils, 'isNonEmptyString');
                    testFunctionExists(window.ValidationUtils, 'hasValue');
                    testFunctionExists(window.ValidationUtils, 'parseOptionalInteger');
                    test('ValidationUtils.isNonEmptyString works', function() {
                        var fn = window.ValidationUtils.isNonEmptyString;
                        return fn('hello') === true && fn('') === false && fn(null) === false;
                    });
                }

                testModuleLoaded('DomUtils', window.DomUtils);
                if (window.DomUtils) {
                    testFunctionExists(window.DomUtils, 'escapeHtml');
                }

                testModuleLoaded('FormUtils', window.FormUtils);
                if (window.FormUtils) {
                    testFunctionExists(window.FormUtils, 'getField');
                    testFunctionExists(window.FormUtils, 'setField');
                }

                testModuleLoaded('NotificationSystem', window.NotificationSystem);
                if (window.NotificationSystem) {
                    testFunctionExists(window.NotificationSystem, 'notify');
                }

                testModuleLoaded('Modal', window.Modal);
                if (window.Modal) {
                    testFunctionExists(window.Modal, 'createModal');
                    testFunctionExists(window.Modal, 'showModal');
                }

                // ---- CONSTANTS ----
                log('', 'info');
                log('--- CONSTANTS ---', 'info');

                testModuleLoaded('CalendarConstants', window.CalendarConstants);
                if (window.CalendarConstants) {
                    test('CalendarConstants.MIN_WEEK exists', function() {
                        return typeof window.CalendarConstants.MIN_WEEK === 'number';
                    });
                    test('CalendarConstants.MAX_WEEK exists', function() {
                        return typeof window.CalendarConstants.MAX_WEEK === 'number';

                    test('CalendarConstants.CALENDAR_START_HOUR exists', function() {
                        return typeof window.CalendarConstants.CALENDAR_START_HOUR === 'number';

                    test('CalendarConstants.getDayName exists', function() {

                testModuleLoaded('CharacterConstants', window.CharacterConstants);
                if (window.CharacterConstants) {

                // ---- SHARED QUERIES ----

                testModuleLoaded('CharacterQueries', window.CharacterQueries);
                if (window.CharacterQueries) {

            // ============================================================
            // AUTO-RUN ON LOAD

            function init() {
                renderDependencyCheck();

                // Wait for all scripts to load
                var checkInterval = setInterval(function() {
                    // Check if critical modules are loaded
                    var criticalModules = [
                        'ObjectUtils', 'ValidationUtils', 'CalendarConstants',
                        'CharacterConstants', 'AcademyConstants', 'TeamConstants',
                        'CalendarQueries', 'MutationPipeline', 'AcademyClasses'
                    ];

                    var allLoaded = true;
                    for (var i = 0; i < criticalModules.length; i++) {
                        if (window[criticalModules[i]] === undefined) {
                            allLoaded = false;
                            break;
                        }
                    }

                    if (allLoaded) {
                        clearInterval(checkInterval);
                        setTimeout(function() {
                            runAllTests();
                        }, 100);
                    }
                }, 200);

                // Safety timeout - run anyway after 5 seconds
                setTimeout(function() {
                    clearInterval(checkInterval);
                    if (testOutput && testOutput.innerHTML === '') {
                        runAllTests();
                    }
                }, 5000);
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }

            document.addEventListener('DOMContentLoaded', function() {
                var btn = document.getElementById('run-tests-btn');
                if (btn) {
                    btn.addEventListener('click', runAllTests);
                }
            });

        })();
